name: CI

# Runs only when the code changes, so a change to the docs does not start a build.
on:
  pull_request:
    paths: ['core/**', 'phone/**', 'tv/**', 'ffmpeg/**', 'gradle/**', '*.kts', 'gradle.properties', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['core/**', 'phone/**', 'tv/**', 'ffmpeg/**', 'gradle/**', '*.kts', 'gradle.properties', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :phone:assembleDebug :tv:assembleDebug
