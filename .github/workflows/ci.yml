name: CI

# Runs only when the code changes, so a change to the docs does not start a build.
on:
  pull_request:
    paths: ['RPM.Android/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['RPM.Android/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test :phone:assembleDebug :tv:assembleDebug
        working-directory: RPM.Android
